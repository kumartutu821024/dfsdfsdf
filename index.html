    ];

    // Calculate validity days
    function calcValidity(endDate) {
      if (!endDate) return '';
      const diff = new Date(parseInt(endDate) * 1000) - Date.now();
      if (diff <= 0) return 'Expired';
      return Math.ceil(diff / 86400000) + ' days';
    }

    // Build course card
    function buildCard(course) {
      const isEnrolled = localStorage.getItem('enrolled_' + course.id) === 'true';
      const validity = course.end_date ? calcValidity(course.end_date) : '';

      return `
        <div class="card" id="card-${course.id}" onclick="window.location.href='/next/next.php?id=nexttoppers_${course.id}'">
          <div class="card-thumb">
            <img src="${course.thumbnail}" alt="${course.title}" loading="lazy">
            ${course.is_trending === 'Trending' ? '<span class="card-badge trending">Trending</span>' : ''}
          </div>
          <div class="card-body">
            <div class="card-title">${course.title}</div>
            ${validity ? `<div class="card-validity"><i class="fas fa-clock"></i> Validity: <span>${validity}</span></div>` : '<div style="height: 18px;"></div>'}
            <div class="card-actions">
              ${isEnrolled ? `
                <button class="card-btn btn-lets-study" onclick="event.stopPropagation();window.location.href='/next/next.php?id=nexttoppers_${course.id}'">
                  <i class="fas fa-circle-play"></i> Let's Study
                </button>
              ` : `
                <button class="card-btn btn-explore" onclick="event.stopPropagation();window.location.href='/next/next.php?id=nexttoppers_${course.id}'">
                  <i class="fas fa-book-open"></i> Explore
                </button>
                <button class="card-btn btn-enroll" onclick="event.stopPropagation();enrollCourse(${course.id}, this)">
                  <i class="fas fa-graduation-cap"></i> Enroll Now
                </button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // Enroll function
    function enrollCourse(id, btn) {
      localStorage.setItem('enrolled_' + id, 'true');
      const actions = btn.closest('.card-actions');
      actions.innerHTML = `
        <button class="card-btn btn-lets-study" onclick="event.stopPropagation();window.location.href='/next/next.php?id=nexttoppers_${id}'">
          <i class="fas fa-circle-play"></i> Let's Study
        </button>
      `;
    }

    // Search functionality
    function setupSearch(inputId, resultsId) {
      const input = document.getElementById(inputId);
      const results = document.getElementById(resultsId);
      const allCourses = [...OUR_COURSES, ...FEATURED_COURSES];

      input.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        if (!query) {
          results.style.display = 'none';
          return;
        }

        const filtered = allCourses.filter(c => c.title.toLowerCase().includes(query));
        if (filtered.length > 0) {
          results.innerHTML = filtered.map(c => `
            <div class="search-result-item" onclick="window.location.href='/next/next.php?id=nexttoppers_${c.id}'">
              <div class="search-result-thumb">
                <img src="${c.thumbnail}" alt="${c.title}">
              </div>
              <span class="search-result-title">${c.title}</span>
              <i class="fas fa-arrow-right" style="font-size: 12px; color: #9ca3af;"></i>
            </div>
          `).join('');
          results.style.display = 'block';
        } else {
          results.style.display = 'none';
        }
      });

      input.addEventListener('focus', () => {
        if (input.value.trim() && results.innerHTML) {
          results.style.display = 'block';
        }
      });

      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !results.contains(e.target)) {
          results.style.display = 'none';
        }
      });
    }

    // Carousel auto-play
    let carouselIndex = 0;
    function autoPlayCarousel() {F
      const track = document.getElementById('carouselTrack');
      carouselIndex = (carouselIndex + 1) % 2;
      track.style.transform = `translateX(-${carouselIndex * 100}%)`;
    }
    setInterval(autoPlayCarousel, 3000);

    // Initialize
    document.getElementById('ourCoursesGrid').innerHTML = OUR_COURSES.map(buildCard).join('');
    document.getElementById('featuredCoursesGrid').innerHTML = FEATURED_COURSES.map(buildCard).join('');
    setupSearch('searchInputMobile', 'searchResultsMobile');
    setupSearch('searchInputDesktop', 'searchResultsDesktop');
</script>
